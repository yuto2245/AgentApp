<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Signup</title>
    <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    rel="stylesheet"
    integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
    crossorigin="anonymous"
  />
</head>
<body>
    <!-- signup.html -->
    <div class="container d-flex justify-content-center align-items-center vh-100">
        <div class="card p-4 shadow rounded-4" style="width: 380px;">
        <h4 class="text-center mb-3">アカウント情報を変更</h4>
        <form id="signupForm">
            <input type="email" id="email" class="form-control mb-2" placeholder="メールアドレス" required>
            <input type="password" id="password" class="form-control mb-3" placeholder="パスワード（8文字以上）" required>
            <button type="submit" class="btn btn-success w-100">変更する</button>
        </form>
        </div>
    </div>

    <!-- ✅ Bootstrap JS（動的コンポーネント用：モーダルなど） -->
    <script
    src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
    integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
    crossorigin="anonymous"
    ></script>
</body>
</html>
