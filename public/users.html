<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>ダッシュボード</title>
    <style>
      :root { color-scheme: light dark; }
      body { font-family: system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, "Noto Sans JP", "Hiragino Kaku Gothic ProN", "Yu Gothic", Meiryo, sans-serif; margin: 0; padding: 2rem; }
      .card { max-width: 720px; margin: 0 auto; border: 1px solid #ccc3; border-radius: 12px; padding: 1.5rem; backdrop-filter: blur(2px); }
      h1 { margin-top: 0; font-size: 1.6rem; }
      .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 12px; margin: 1rem 0; }
      .stat { border: 1px solid #ccc3; border-radius: 10px; padding: 1rem; text-align: center; }
      .label { color: #888; font-size: 0.9rem; }
      .value { font-size: 1.8rem; font-weight: 700; margin-top: 6px; }
      .row { display: flex; gap: 8px; align-items: center; }
      button { padding: 8px 12px; border-radius: 8px; border: 1px solid #ccc6; cursor: pointer; background: transparent; }
      .error { color: #c0392b; margin-top: 8px; white-space: pre-wrap; }
      .muted { color: #777; font-size: 0.9rem; }
      a { color: inherit; }
    </style>
  </head>
  <body>
    <div class="card">
      <h1>ユーザー数</h1>
      <div class="grid">
        <div class="stat">
          <div class="label">AppUser（登録総数）</div>
          <div class="value" id="appUser">-</div>
        </div>
        <div class="stat">
          <div class="label">Chainlit User（総数）</div>
          <div class="value" id="chainlitUser">-</div>
        </div>
        <div class="stat">
          <div class="label">DAU（1日）</div>
          <div class="value" id="dau">-</div>
        </div>
        <div class="stat">
          <div class="label">WAU（7日）</div>
          <div class="value" id="wau">-</div>
        </div>
        <div class="stat">
          <div class="label">MAU（30日）</div>
          <div class="value" id="mau">-</div>
        </div>
      </div>

      <div class="row">
        <button id="reload">再読み込み</button>
        <span class="muted" id="updatedAt"></span>
      </div>
      <div class="error" id="error" hidden></div>
      <p class="muted">API: <code>/api/users/count</code>（同一オリジン）</p>
      <p class="muted"><a href="/public/auth/index.html">ログインページへ</a></p>
    </div>

    <script>
      async function loadCounts() {
        const err = document.getElementById('error');
        err.hidden = true; err.textContent = '';
        try {
          const res = await fetch('/api/users/count', { credentials: 'same-origin' });
          if (!res.ok) throw new Error(`HTTP ${res.status}`);
          const data = await res.json();
          const active = data.active || {};
          document.getElementById('appUser').textContent = data.app_user_count ?? '-';
          document.getElementById('chainlitUser').textContent = data.chainlit_user_count ?? '-';
          document.getElementById('dau').textContent = active.DAU ?? '-';
          document.getElementById('wau').textContent = active.WAU ?? '-';
          document.getElementById('mau').textContent = active.MAU ?? '-';
          document.getElementById('updatedAt').textContent = `更新: ${new Date().toLocaleString()}`;
        } catch (e) {
          err.hidden = false;
          err.textContent = `読み込みに失敗しました: ${e?.message || e}`;
        }
      }

      document.getElementById('reload').addEventListener('click', loadCounts);
      window.addEventListener('load', loadCounts);
    </script>
  </body>
  </html>
