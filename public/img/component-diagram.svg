<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="960" height="560" viewBox="0 0 960 560">
  <style>
    .layer { fill: #f7f8ff; stroke: #2f3b63; stroke-width: 1.4; rx: 16; ry: 16; }
    .module { fill: #eef1ff; stroke: #3a4d88; stroke-width: 1.3; rx: 12; ry: 12; }
    .title { font-family: "Helvetica", sans-serif; font-size: 18px; font-weight: 700; fill: #1b2553; }
    .label { font-family: "Helvetica", sans-serif; font-size: 14px; fill: #1b2553; }
    .arrow { stroke: #3451b2; stroke-width: 1.4; marker-end: url(#arrowhead); fill: none; }
  </style>
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#3451b2"/>
    </marker>
  </defs>

  <rect class="layer" x="40" y="40" width="880" height="480"/>
  <text class="title" x="120" y="70">Presentation Layer</text>
  <rect class="module" x="80" y="100" width="200" height="90"/>
  <text class="label" x="180" y="135" text-anchor="middle">Chainlit UI</text>
  <text class="label" x="180" y="155" text-anchor="middle">chat settings / prompts</text>

  <rect class="module" x="320" y="100" width="200" height="90"/>
  <text class="label" x="420" y="135" text-anchor="middle">Auth Pages</text>
  <text class="label" x="420" y="155" text-anchor="middle">index.html / signup.html</text>

  <rect class="module" x="560" y="100" width="200" height="90"/>
  <text class="label" x="660" y="135" text-anchor="middle">Front JS</text>
  <text class="label" x="660" y="155" text-anchor="middle">auth.js validation</text>

  <rect class="layer" x="40" y="220" width="880" height="140"/>
  <text class="title" x="120" y="250">Application Layer</text>

  <rect class="module" x="80" y="270" width="200" height="70"/>
  <text class="label" x="180" y="300" text-anchor="middle">FastAPI Router</text>
  <text class="label" x="180" y="320" text-anchor="middle">/api/register /users/count</text>

  <rect class="module" x="320" y="270" width="200" height="70"/>
  <text class="label" x="420" y="300" text-anchor="middle">Chainlit Callbacks</text>
  <text class="label" x="420" y="320" text-anchor="middle">password_auth / data_layer</text>

  <rect class="module" x="560" y="260" width="200" height="90"/>
  <text class="label" x="660" y="295" text-anchor="middle">Conversation Orchestrator</text>
  <text class="label" x="660" y="315" text-anchor="middle">LLM provider selection</text>

  <rect class="layer" x="40" y="380" width="880" height="140"/>
  <text class="title" x="120" y="410">Infrastructure Layer</text>

  <rect class="module" x="80" y="430" width="200" height="70"/>
  <text class="label" x="180" y="460" text-anchor="middle">Auth Module</text>
  <text class="label" x="180" y="480" text-anchor="middle">email.py bcrypt / tokens</text>

  <rect class="module" x="320" y="430" width="200" height="70"/>
  <text class="label" x="420" y="460" text-anchor="middle">AppDataLayer</text>
  <text class="label" x="420" y="480" text-anchor="middle">asyncpg normalization</text>

  <rect class="module" x="560" y="430" width="200" height="70"/>
  <text class="label" x="660" y="460" text-anchor="middle">LLM Clients</text>
  <text class="label" x="660" y="480" text-anchor="middle">OpenAI / Anthropic etc.</text>

  <rect class="module" x="800" y="430" width="100" height="70"/>
  <text class="label" x="850" y="460" text-anchor="middle">SMTP Helper</text>

  <!-- connections -->
  <line class="arrow" x1="180" y1="190" x2="180" y2="270"/>
  <line class="arrow" x1="420" y1="190" x2="420" y2="270"/>
  <line class="arrow" x1="660" y1="190" x2="660" y2="270"/>

  <line class="arrow" x1="180" y1="340" x2="180" y2="430"/>
  <line class="arrow" x1="420" y1="340" x2="420" y2="430"/>
  <line class="arrow" x1="660" y1="340" x2="660" y2="430"/>
  <line class="arrow" x1="850" y1="340" x2="850" y2="430"/>
</svg>
