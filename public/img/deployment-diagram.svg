<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="960" height="520" viewBox="0 0 960 520">
  <style>
    .env { fill: #f8f9ff; stroke: #2f3b63; stroke-width: 1.5; rx: 18; ry: 18; }
    .node { fill: #eef1ff; stroke: #3a4d88; stroke-width: 1.4; rx: 12; ry: 12; }
    .title { font-family: "Helvetica", sans-serif; font-size: 18px; font-weight: 700; fill: #1b2553; }
    .text { font-family: "Helvetica", sans-serif; font-size: 13px; fill: #1b2553; }
    .arrow { stroke: #3451b2; stroke-width: 1.5; marker-end: url(#arrowhead); fill: none; }
    .note { font-family: "Helvetica", sans-serif; font-size: 12px; fill: #46507a; font-style: italic; }
  </style>
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#3451b2"/>
    </marker>
  </defs>

  <!-- Local environment -->
  <rect class="env" x="40" y="60" width="260" height="360"/>
  <text class="title" x="170" y="90" text-anchor="middle">Local (Developer)</text>
  <rect class="node" x="70" y="120" width="200" height="80"/>
  <text class="text" x="170" y="150" text-anchor="middle">Chainlit Dev Server</text>
  <text class="text" x="170" y="168" text-anchor="middle">poetry / uv / dotenv</text>
  <rect class="node" x="70" y="220" width="200" height="80"/>
  <text class="text" x="170" y="250" text-anchor="middle">Mailhog / Mailtrap</text>
  <text class="text" x="170" y="268" text-anchor="middle">SMTP sandbox</text>
  <rect class="node" x="70" y="320" width="200" height="60"/>
  <text class="text" x="170" y="350" text-anchor="middle">SQLite / Local PG (optional)</text>

  <!-- Staging -->
  <rect class="env" x="340" y="40" width="260" height="380"/>
  <text class="title" x="470" y="70" text-anchor="middle">Heroku Staging</text>
  <rect class="node" x="370" y="110" width="200" height="90"/>
  <text class="text" x="470" y="140" text-anchor="middle">AgentApp Dyno (web)</text>
  <text class="text" x="470" y="160" text-anchor="middle">Gunicorn + Chainlit</text>
  <rect class="node" x="370" y="220" width="200" height="80"/>
  <text class="text" x="470" y="250" text-anchor="middle">Heroku Postgres (stg)</text>
  <rect class="node" x="370" y="320" width="200" height="60"/>
  <text class="text" x="470" y="350" text-anchor="middle">Config Vars (stg)</text>

  <!-- Production -->
  <rect class="env" x="640" y="20" width="260" height="400"/>
  <text class="title" x="770" y="50" text-anchor="middle">Heroku Production</text>
  <rect class="node" x="670" y="90" width="200" height="90"/>
  <text class="text" x="770" y="120" text-anchor="middle">AgentApp Dyno (web)</text>
  <text class="text" x="770" y="140" text-anchor="middle">Procfile / runtime.txt</text>
  <rect class="node" x="670" y="200" width="200" height="80"/>
  <text class="text" x="770" y="230" text-anchor="middle">Heroku Postgres (prod)</text>
  <rect class="node" x="670" y="300" width="200" height="80"/>
  <text class="text" x="770" y="330" text-anchor="middle">SendGrid SMTP</text>
  <text class="text" x="770" y="350" text-anchor="middle">ENV: SMTP_* / APP_BASE_URL</text>

  <!-- Edges -->
  <line class="arrow" x1="300" y1="160" x2="340" y2="160"/>
  <text class="text" x="320" y="150" text-anchor="middle">git push staging</text>

  <line class="arrow" x1="600" y1="140" x2="640" y2="140"/>
  <text class="text" x="620" y="130" text-anchor="middle">git push heroku</text>

  <line class="arrow" x1="470" y1="330" x2="470" y2="380"/>
  <text class="note" x="470" y="400" text-anchor="middle">Managed config vars</text>

  <line class="arrow" x1="770" y1="380" x2="770" y2="410"/>
  <text class="note" x="770" y="430" text-anchor="middle">Alerts / monitoring</text>
</svg>
